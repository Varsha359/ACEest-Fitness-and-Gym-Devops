name: ACEest CI Pipeline

on:
  push:
    branches: [develop, main]
    tags:
      - 'v*'
  pull_request:
    branches: [develop, main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    steps:
      # Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          # ✅ Test dependencies (same as Jenkins)
          pip install pytest pytest-html pytest-cov allure-pytest

      # Run tests + reports
      - name: Run tests
        run: |
          mkdir -p test-results allure-results

          PYTHONPATH=. pytest tests/ -v --tb=short \
            --junitxml=test-results/junit.xml \
            --html=test-results/report.html --self-contained-html \
            --cov=app --cov-report=xml \
            --alluredir=allure-results

      # Upload test reports
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            test-results/
            allure-results/

      # Build Docker image
      - name: Build Docker image with version tag
        run: |
          IMAGE_TAG=${GITHUB_REF##*/}
          docker build -t aceest-fitness:$IMAGE_TAG .