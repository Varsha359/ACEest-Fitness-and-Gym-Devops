apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  labels:
    app: aceest
    variant: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest
      variant: blue
  template:
    metadata:
      labels:
        app: aceest
        variant: blue
    spec:
      containers:
        - name: aceest
          image: aceest-fitness-api:staging
          ports:
            - containerPort: 5000

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
  labels:
    app: aceest
    variant: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest
      variant: green
  template:
    metadata:
      labels:
        app: aceest
        variant: green
    spec:
      containers:
        - name: aceest
          image: aceest-fitness-api:staging
          ports:
            - containerPort: 5000
