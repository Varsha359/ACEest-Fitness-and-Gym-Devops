apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-rolling
  labels:
    app: aceest
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: aceest
      track: rolling
  template:
    metadata:
      labels:
        app: aceest
        track: rolling
    spec:
      containers:
        - name: aceest
          image: aceest-fitness-api:rolling
          ports:
            - containerPort: 5000
