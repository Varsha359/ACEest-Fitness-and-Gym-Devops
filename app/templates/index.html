<!DOCTYPE html>
<html>
<head>
    <title>ACEest v1.1.2</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h1>ACEest Fitness Dashboard</h1>

<form method="POST">
    <input name="name" placeholder="Name" required>
    <input name="age" placeholder="Age" required>
    <input name="weight" placeholder="Weight" required>

    <select name="program">
        {% for p in programs %}
        <option value="{{p}}">{{p}}</option>
        {% endfor %}
    </select>

    <input type="range" name="adherence" min="0" max="100">

    <input name="notes" placeholder="Coach Notes">

    <button type="submit">Save Client</button>
</form>

<a href="/export">
    <button>Export CSV</button>
</a>

<h2>Clients</h2>

<table border="1">
<tr>
    <th>Name</th><th>Age</th><th>Weight</th>
    <th>Program</th><th>Adherence</th><th>Notes</th>
</tr>

{% for c in clients %}
<tr>
    <td>{{c.name}}</td>
    <td>{{c.age}}</td>
    <td>{{c.weight}}</td>
    <td>{{c.program}}</td>
    <td>{{c.adherence}}</td>
    <td>{{c.notes}}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
