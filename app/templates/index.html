<!DOCTYPE html>
<html>
<head>
    <title>ACEest Fitness</title>
</head>
<body>
    <h1>Select Your Fitness Program</h1>

    <form method="POST">
        <select name="program">
            {% for p in programs %}
                <option value="{{ p }}">{{ p }}</option>
            {% endfor %}
        </select>

        <button type="submit">View Plan</button>
    </form>
</body>
</html>
